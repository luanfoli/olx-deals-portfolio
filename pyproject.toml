[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["olx_deals", "olx_scraper", "app"]
branch = true
omit = ["tests/*", ".venv/*", "__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
